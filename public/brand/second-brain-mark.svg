<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Second Brain – Schnittmenge des Wissens</title>
  <defs>
    <circle id="knowledge-top" cx="32" cy="21" r="18.5"/>
    <circle id="knowledge-left" cx="21.5" cy="39.2" r="18.5"/>
    <circle id="knowledge-right" cx="42.5" cy="39.2" r="18.5"/>
    <clipPath id="knowledge-top-clip"><use href="#knowledge-top"/></clipPath>
    <clipPath id="knowledge-left-clip"><use href="#knowledge-left"/></clipPath>
    <mask id="knowledge-boundaries" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <g fill="none" stroke="#000" stroke-width="1.85">
        <use href="#knowledge-top"/>
        <use href="#knowledge-left"/>
        <use href="#knowledge-right"/>
      </g>
    </mask>
  </defs>
  <g mask="url(#knowledge-boundaries)">
    <use href="#knowledge-top" fill="#a5b797"/>
    <use href="#knowledge-left" fill="#315743"/>
    <use href="#knowledge-right" fill="#b47755"/>
    <g clip-path="url(#knowledge-top-clip)" fill="#a5b797">
      <use href="#knowledge-left"/>
      <use href="#knowledge-right"/>
    </g>
    <g clip-path="url(#knowledge-left-clip)">
      <use href="#knowledge-right" fill="#a5b797"/>
      <g clip-path="url(#knowledge-top-clip)">
        <use href="#knowledge-right" fill="#315743"/>
      </g>
    </g>
  </g>
</svg>
